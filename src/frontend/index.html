<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mejiro Express</title>
  </head>
  <body>
    <div id="app">
      <div id="status">Select a JSON file</div>
      <div id="input-controls">
        <input id="board-file" type="file" accept=".json,application/json" />
        <button id="solve" disabled>Solve</button>
      </div>
      <div id="controls">
        <button id="previous" disabled>Previous</button>
        <button id="play" disabled>Play</button>
        <button id="next" disabled>Next</button>
      </div>
      <div id="viewport"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

services:
  backend:
    build: ./src/backend
    ports:
      - "6969:6969"
    volumes:
      - ./src/backend:/app

  frontend:
    build: ./src/frontend
    ports:
      - "6767:6767"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:6969
    depends_on:
      - backend

volumes:
  frontend_node_modules:
